# Sveltia CMS configuration — ENGLISH-label twin of /admin for the developer.
# The owner's Thai-first admin is public/admin/config.yml (served at /admin).
# Same backend, same collections, same content — presentation strings only.
# Structural parity between the two files is enforced in CI by
# scripts/check-admin-config-parity.ts (labels/hints/summaries may differ,
# everything else must match, including key order).

backend:
  name: github
  repo: kostia7alania/apple-vegan-cafe
  branch: main
  base_url: https://auth.apple-vegan-cafe.com # deployed sveltia-cms-auth Worker

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: dishes
    label: 'Menu dishes'
    label_singular: 'Dish'
    folder: src/content/dishes
    format: json
    extension: json
    create: true
    slug: '{{fields.name.en | slugify}}'
    summary: '{{fields.name.en}} — ฿{{fields.price_thb}}'
    fields:
      - name: name
        label: 'Name'
        widget: object
        fields:
          - { name: en, label: 'English', widget: string }
          - { name: th, label: 'ไทย', widget: string }
          - { name: ru, label: 'Русский', widget: string }
      - name: price_thb
        label: 'Price (THB)'
        widget: number
        value_type: float
        min: 1
      - name: category
        label: 'Category'
        widget: select
        options:
          - { label: 'One-plate dishes', value: one-plate }
          - { label: 'Mains to share (with rice)', value: mains-share }
          - { label: 'Snacks & starters', value: snacks }
          - { label: 'Pizza & fast food', value: pizza-fastfood }
          - { label: 'Drinks', value: drinks }
      - name: available
        label: 'Available'
        widget: boolean
        default: true
        hint: 'Out of stock / paused → switch off and Save; the dish disappears from the site. Switch back on when it returns.'
      - name: featured
        label: 'Show on home page'
        widget: boolean
        default: false
        required: false
      - name: description
        label: 'Description'
        widget: object
        required: false
        fields:
          - { name: en, label: 'English', widget: text, required: false }
          - { name: th, label: 'ไทย', widget: text, required: false }
          - { name: ru, label: 'Русский', widget: text, required: false }
      - name: slug
        label: 'URL slug (per language)'
        widget: object
        hint: 'Technical — changing it breaks saved/indexed links; add the old one to previousSlugs.'
        fields:
          - { name: en, label: 'English', widget: string }
          - { name: th, label: 'ไทย', widget: string }
          - { name: ru, label: 'Русский', widget: string }
      - name: images
        label: 'Photos'
        widget: list
        required: false
        field: { name: image, label: 'Image', widget: image }
      - name: dietaryTags
        label: 'Dietary tags'
        widget: select
        multiple: true
        default: [vegan]
        options:
          - { label: 'vegan', value: vegan }
          - { label: 'jay', value: jay }
          - { label: 'jain-friendly', value: jain-friendly }
          - { label: 'gluten-free', value: gluten-free }
          - { label: 'raw', value: raw }
          - { label: 'nut-free', value: nut-free }
      - name: allergens
        label: 'Allergens'
        widget: select
        multiple: true
        required: false
        options:
          - { label: 'peanut', value: peanut }
          - { label: 'soy', value: soy }
          - { label: 'gluten', value: gluten }
      - name: spicyLevel
        label: 'Spicy level (0–3)'
        widget: number
        value_type: int
        min: 0
        max: 3
        default: 0
      - name: source
        label: 'Data source'
        widget: select
        default: owner
        options:
          - { label: 'Grab export (grab_export)', value: grab_export }
          - { label: 'From the owner (owner)', value: owner }
          - { label: 'Retyped from paper menu (retyped)', value: retyped }
      - name: reviewedAt
        label: 'Reviewed on'
        widget: datetime
        required: false
        default: ''
      - name: previousSlugs
        label: 'Previous slugs (for redirects)'
        widget: list
        required: false
        field: { name: slug, label: slug, widget: string }

  - name: articles_en
    label: 'Blog (English)'
    folder: src/content/articles/en
    create: true
    slug: '{{fields.slug}}'
    fields:
      - name: translationKey
        label: 'Translation key (same across languages)'
        widget: string
        hint: 'Use the same key for the same article in every language.'
      - { name: locale, label: 'Language', widget: hidden, default: en }
      - { name: title, label: 'Title', widget: string }
      - { name: description, label: 'Short description (meta)', widget: text }
      - { name: slug, label: 'URL slug', widget: string }
      - name: author
        label: 'Author'
        widget: select
        default: family
        options:
          - { label: 'family', value: family }
      - name: publishedAt
        label: 'Published'
        widget: datetime
        format: 'YYYY-MM-DD'
      - name: draft
        label: 'Draft'
        widget: boolean
        default: true
        hint: 'On = not shown on the site yet.'
      - { name: body, label: 'Text', widget: markdown }

  - name: articles_th
    label: 'Blog (ไทย)'
    folder: src/content/articles/th
    create: true
    slug: '{{fields.slug}}'
    fields:
      - name: translationKey
        label: 'Translation key (same across languages)'
        widget: string
        hint: 'Use the same key for the same article in every language.'
      - { name: locale, label: 'Language', widget: hidden, default: th }
      - { name: title, label: 'Title', widget: string }
      - { name: description, label: 'Short description (meta)', widget: text }
      - { name: slug, label: 'URL slug', widget: string }
      - name: author
        label: 'Author'
        widget: select
        default: family
        options:
          - { label: 'family', value: family }
      - name: publishedAt
        label: 'Published'
        widget: datetime
        format: 'YYYY-MM-DD'
      - name: draft
        label: 'Draft'
        widget: boolean
        default: true
        hint: 'On = not shown on the site yet.'
      - { name: body, label: 'Text', widget: markdown }

  - name: articles_ru
    label: 'Blog (Русский)'
    folder: src/content/articles/ru
    create: true
    slug: '{{fields.slug}}'
    fields:
      - name: translationKey
        label: 'Translation key (same across languages)'
        widget: string
        hint: 'Use the same key for the same article in every language.'
      - { name: locale, label: 'Language', widget: hidden, default: ru }
      - { name: title, label: 'Title', widget: string }
      - { name: description, label: 'Short description (meta)', widget: text }
      - { name: slug, label: 'URL slug', widget: string }
      - name: author
        label: 'Author'
        widget: select
        default: family
        options:
          - { label: 'family', value: family }
      - name: publishedAt
        label: 'Published'
        widget: datetime
        format: 'YYYY-MM-DD'
      - name: draft
        label: 'Draft'
        widget: boolean
        default: true
        hint: 'On = not shown on the site yet.'
      - { name: body, label: 'Text', widget: markdown }

  - name: pages
    label: 'Static pages'
    folder: src/content/pages
    create: false
    fields:
      - { name: translationKey, label: 'Translation key', widget: string }
      - name: locale
        label: 'Language'
        widget: select
        options:
          - { label: 'English', value: en }
          - { label: 'ไทย', value: th }
          - { label: 'Русский', value: ru }
      - { name: title, label: 'Title', widget: string }
      - { name: description, label: 'Short description (meta)', widget: text }
      - { name: body, label: 'Text', widget: markdown }

  - name: site
    label: 'Site settings'
    files:
      - name: settings
        label: 'Cafe info (name, phone, links)'
        file: src/content/settings.json
        fields:
          - name: site
            label: 'Settings'
            widget: object
            fields:
              - { name: name, label: 'Official name', widget: string }
              - name: nameLocalized
                label: 'Displayed name'
                widget: object
                fields:
                  - { name: en, label: 'English', widget: string }
                  - { name: th, label: 'ไทย', widget: string }
                  - { name: ru, label: 'Русский', widget: string }
              - name: tagline
                label: 'Tagline'
                widget: object
                fields:
                  - { name: en, label: 'English', widget: string }
                  - { name: th, label: 'ไทย', widget: string }
                  - { name: ru, label: 'Русский', widget: string }
              - { name: phone, label: 'Phone', widget: string }
              - { name: whatsapp, label: 'WhatsApp link', widget: string, required: false }
              - { name: lineId, label: 'LINE ID', widget: string, required: false }
              - { name: email, label: 'Email', widget: string, required: false }
              - name: social
                label: 'Social links'
                widget: list
                required: false
                fields:
                  - { name: platform, label: 'Platform', widget: string }
                  - { name: url, label: 'URL', widget: string }
              - name: orderingLinks
                label: 'Ordering links (Grab…)'
                widget: list
                required: false
                fields:
                  - { name: provider, label: 'Provider', widget: string }
                  - { name: url, label: 'URL', widget: string }
              - name: reviewLinks
                label: 'Review links'
                widget: object
                fields:
                  - { name: google, label: Google, widget: string, required: false }
                  - { name: happycow, label: HappyCow, widget: string, required: false }
                  - { name: tripadvisor, label: TripAdvisor, widget: string, required: false }
      - name: location
        label: 'Address & opening hours'
        file: src/content/locations.json
        fields:
          - name: pattaya
            label: 'Pattaya'
            widget: object
            fields:
              - name: address
                label: 'Address'
                widget: object
                fields:
                  - { name: en, label: 'English', widget: string }
                  - { name: th, label: 'ไทย', widget: string }
                  - { name: ru, label: 'Русский', widget: string }
              - name: geo
                label: 'Coordinates (from the exact Google Maps pin)'
                widget: object
                required: false
                fields:
                  - { name: lat, label: 'Latitude', widget: number, value_type: float }
                  - { name: lng, label: 'Longitude', widget: number, value_type: float }
              - { name: mapsUrl, label: 'Google Maps link', widget: string, required: false }
              - name: hours
                label: 'Opening hours'
                widget: list
                fields:
                  - name: days
                    label: 'Days'
                    widget: select
                    multiple: true
                    options:
                      - { label: 'Mon', value: mon }
                      - { label: 'Tue', value: tue }
                      - { label: 'Wed', value: wed }
                      - { label: 'Thu', value: thu }
                      - { label: 'Fri', value: fri }
                      - { label: 'Sat', value: sat }
                      - { label: 'Sun', value: sun }
                  - { name: open, label: 'Opens (HH:MM)', widget: string }
                  - { name: close, label: 'Closes (HH:MM)', widget: string }
              - name: specialHours
                label: 'Special days (holidays)'
                widget: list
                required: false
                fields:
                  - { name: date, label: 'Date (YYYY-MM-DD)', widget: string }
                  - name: open
                    label: 'Opens'
                    widget: string
                    required: false
                    hint: 'Leave empty = closed all day.'
                  - { name: close, label: 'Closes', widget: string, required: false }
                  - { name: note, label: 'Note', widget: string, required: false }
