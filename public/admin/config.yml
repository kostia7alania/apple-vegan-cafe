# Sveltia CMS configuration (Decap-compatible format — the same file works with
# Decap CMS as an escape hatch).
#
# SETUP (developer, one-time):
# 1. Replace `repo` with the real GitHub owner/repo once it is pushed.
# 2. Deploy https://github.com/sveltia/sveltia-cms-auth as a Cloudflare Worker,
#    set its GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET as Worker secrets (dashboard
#    only — never in this repo), and put its URL into `base_url`.
#
# Storage model note: translations live as {en,th,ru} objects per field; the
# price exists exactly once per dish. We intentionally do NOT use the CMS i18n
# feature for JSON data collections — object widgets match our schema exactly.
# Categories/allergens/FAQs/redirects are developer-edited in git (rarely change).
#
# Label language: Thai first, English in parentheses. The admin is used by the
# Thai-speaking family; the English tail lets the developer guide them over the
# phone. Sveltia's own UI chrome ships only en/ja locales (verified in the
# pinned 0.172.4 bundle), so config labels are the translatable 90% of what the
# owner sees. Thai option labels for categories/tags mirror the site content
# (categories.json, src/lib/ui.ts) — keep them in sync.
# Developer's English twin: public/admin/en/config.yml (served at /admin/en) —
# structural parity is enforced by scripts/check-admin-config-parity.ts.

backend:
  name: github
  repo: kostia7alania/apple-vegan-cafe
  branch: main
  base_url: https://auth.apple-vegan-cafe.com # deployed sveltia-cms-auth Worker

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: dishes
    label: 'รายการอาหาร (Menu dishes)'
    label_singular: 'อาหาร (Dish)'
    folder: src/content/dishes
    format: json
    extension: json
    create: true
    slug: '{{fields.name.en | slugify}}'
    summary: '{{fields.name.th}} · {{fields.name.en}} — ฿{{fields.price_thb}}'
    fields:
      - {
          name: name,
          label: 'ชื่ออาหาร (Name)',
          widget: object,
          fields:
            [
              { name: en, label: 'อังกฤษ (English)', widget: string },
              { name: th, label: ไทย, widget: string },
              { name: ru, label: 'รัสเซีย (Русский)', widget: string },
            ],
        }
      - {
          name: price_thb,
          label: 'ราคา บาท (Price, THB)',
          widget: number,
          value_type: float,
          min: 1,
        }
      - {
          name: category,
          label: 'หมวดหมู่ (Category)',
          widget: select,
          options:
            [
              { label: 'อาหารจานเดียว (One-plate)', value: one-plate },
              { label: 'กับข้าว (Mains to share)', value: mains-share },
              { label: 'ของทานเล่น (Snacks)', value: snacks },
              { label: 'ฟาสต์ฟู้ด (Pizza & fast food)', value: pizza-fastfood },
              { label: 'เครื่องดื่ม (Drinks)', value: drinks },
            ],
        }
      - {
          name: available,
          label: 'ยังขายอยู่ — ปิด = ซ่อนจากเว็บ (Available)',
          widget: boolean,
          default: true,
        }
      - {
          name: featured,
          label: 'แสดงหน้าแรกและเมนูแนะนำ (Home + quick picks)',
          widget: boolean,
          default: false,
          required: false,
        }
      - {
          name: description,
          label: 'คำอธิบาย (Description)',
          widget: object,
          required: false,
          fields:
            [
              { name: en, label: 'อังกฤษ (English)', widget: text, required: false },
              { name: th, label: ไทย, widget: text, required: false },
              { name: ru, label: 'รัสเซีย (Русский)', widget: text, required: false },
            ],
        }
      - {
          name: slug,
          label: 'ลิงก์ URL แยกตามภาษา (Slug)',
          widget: object,
          fields:
            [
              { name: en, label: 'อังกฤษ (English)', widget: string },
              { name: th, label: ไทย, widget: string },
              { name: ru, label: 'รัสเซีย (Русский)', widget: string },
            ],
        }
      - {
          name: images,
          label: 'รูปอาหารที่อนุมัติสิทธิ์แล้ว (Approved photos — rights required)',
          widget: list,
          required: false,
          summary: '{{fields.src}} — อนุมัติใช้บนเว็บไซต์แล้ว (approved for website)',
          hint: 'อัปโหลดเฉพาะหลังตรวจรูปตรงกับจาน เจ้าของสิทธิ์ และสิทธิ์เผยแพร่ครบแล้ว หากยังไม่ยืนยันให้เว้นรายการนี้ว่างค่ะ',
          fields:
            [
              { name: src, label: 'ไฟล์รูปหลัก (Fallback image)', widget: image },
              {
                name: srcSmall,
                label: 'รูปขนาด 960px ที่ปรับแล้ว (960w variant)',
                widget: image,
                required: false,
              },
              {
                name: srcLarge,
                label: 'รูปขนาด 1600px ที่ปรับแล้ว (1600w variant)',
                widget: image,
                required: false,
              },
              {
                name: width,
                label: 'ความกว้างจริง พิกเซล (Intrinsic width)',
                widget: number,
                value_type: int,
              },
              {
                name: height,
                label: 'ความสูงจริง พิกเซล (Intrinsic height)',
                widget: number,
                value_type: int,
              },
              {
                name: origin,
                label: 'ที่มาของรูป (Origin)',
                widget: select,
                options:
                  [
                    { label: 'รูปต้นฉบับของเจ้าของร้าน (Owner original)', value: owner-original },
                    { label: 'รูปที่มีใบอนุญาต (Licensed)', value: licensed },
                    { label: 'ภาพที่สร้างด้วย AI (AI-generated)', value: ai-generated },
                  ],
              },
              { name: rightsHolder, label: 'ผู้ถือสิทธิ์ (Rights holder)', widget: string },
              {
                name: permission,
                label: 'สิทธิ์เผยแพร่ — อนุมัติแล้วเท่านั้น (Publication permission)',
                widget: select,
                options: [{ label: 'อนุญาตแล้ว (Granted)', value: granted }],
              },
              {
                name: permissionScope,
                label: 'สิทธิ์ใช้บนเว็บ ครอป และทำหลายขนาด (Website and derivatives)',
                widget: select,
                options:
                  [
                    {
                      label: 'ใช้บนเว็บ ครอป และทำหลายขนาดได้ (Website and derivatives)',
                      value: website-and-derivatives,
                    },
                  ],
              },
              {
                name: confirmedBy,
                label: 'ผู้ยืนยันสิทธิ์ (Permission confirmed by)',
                widget: string,
              },
              {
                name: confirmedAt,
                label: 'วันที่ยืนยันสิทธิ์ YYYY-MM-DD (Permission date)',
                widget: string,
              },
              {
                name: peopleVisibility,
                label: 'ผลตรวจบุคคลในภาพ — ต้องตรวจทุกภาพ (People review)',
                widget: select,
                options:
                  [
                    {
                      label: 'ตรวจแล้ว ไม่มีบุคคลที่ระบุตัวตนได้ (None confirmed)',
                      value: none-confirmed,
                    },
                    {
                      label: 'มีบุคคลที่ระบุตัวตนได้ (Recognisable people)',
                      value: recognisable-present,
                    },
                  ],
              },
              {
                name: peopleConsent,
                label: 'ความยินยอมของบุคคลในภาพ (People consent)',
                widget: select,
                options:
                  [
                    {
                      label: 'ไม่เกี่ยวข้อง — ตรวจแล้วไม่มีคน (Not applicable)',
                      value: not-applicable,
                    },
                    { label: 'ทุกคนอนุญาตแล้ว (Granted)', value: granted },
                  ],
              },
              {
                name: credit,
                label: 'เครดิตบนเว็บ — บังคับสำหรับ licensed (Public credit)',
                widget: string,
                required: false,
              },
            ],
        }
      - name: foodFacts
        label: 'ข้อมูลอาหารที่ครอบครัวตรวจยืนยันแล้ว (Verified food facts)'
        widget: object
        hint: 'ตรวจทีละจานจากสูตรและวัตถุดิบจริง ห้ามเดาจากชื่อหรือรูป ช่องว่างไม่แปลว่า allergen-free'
        fields:
          - {
              name: spicyLevel,
              label: 'ระดับความเผ็ดสูตรปกติ — ว่าง = ยังไม่ทราบ, 0–3 = ตรวจแล้ว (Base spicy level)',
              widget: number,
              value_type: int,
              min: 0,
              max: 3,
              required: false,
            }
          - name: allergens
            label: 'การตรวจสารก่อภูมิแพ้ที่ระบบรองรับ (Allergen review)'
            widget: object
            fields:
              - {
                  name: status,
                  label: 'สถานะ (Status)',
                  widget: select,
                  options:
                    [
                      { label: 'ยังไม่ตรวจ (Unknown)', value: unknown },
                      { label: 'ตรวจแล้ว (Verified)', value: verified },
                    ],
                  default: unknown,
                }
              - {
                  name: contains,
                  label: 'สารก่อภูมิแพ้ที่พบ — ว่างไม่ใช่คำรับรอง allergen-free (Contains)',
                  widget: select,
                  multiple: true,
                  required: false,
                  options:
                    [
                      { label: 'ถั่วลิสง (Peanut)', value: peanut },
                      { label: 'ถั่วเหลือง (Soy)', value: soy },
                      { label: 'กลูเตน (Gluten)', value: gluten },
                    ],
                }
          - {
              name: noGlutenIngredients,
              label: 'สูตรที่ตรวจแล้วไม่มีส่วนผสมที่มีกลูเตน (No gluten ingredients)',
              widget: select,
              options:
                [
                  { label: 'ยังไม่ทราบ (Unknown)', value: unknown },
                  { label: 'ใช่ (Yes)', value: yes },
                  { label: 'ไม่ใช่ (No)', value: no },
                ],
              default: unknown,
            }
          - {
              name: jainFriendly,
              label: 'สูตรปกติเหมาะกับผู้ทาน Jain (Jain-friendly recipe)',
              widget: select,
              options:
                [
                  { label: 'ยังไม่ทราบ (Unknown)', value: unknown },
                  { label: 'ใช่ (Yes)', value: yes },
                  { label: 'ไม่ใช่ (No)', value: no },
                ],
              default: unknown,
            }
          - {
              name: verifiedBy,
              label: 'ผู้ตรวจข้อมูลอาหาร (Verified by)',
              widget: string,
              required: false,
            }
          - {
              name: verifiedAt,
              label: 'วันที่ตรวจข้อมูลอาหาร YYYY-MM-DD (Verified at)',
              widget: string,
              required: false,
            }
      - {
          name: source,
          label: 'ที่มาของข้อมูล (Data source)',
          widget: select,
          options:
            [
              { label: 'นำเข้าจาก Grab (Grab export)', value: grab_export },
              { label: 'เจ้าของร้านยืนยัน (Owner)', value: owner },
              { label: 'พิมพ์จากเมนู (Retyped)', value: retyped },
            ],
          default: owner,
        }
      - {
          name: reviewedAt,
          label: 'วันที่เจ้าของตรวจคำอธิบาย — ไม่ยืนยัน food facts (Owner review date)',
          widget: datetime,
          required: false,
          default: '',
        }
      - {
          name: previousSlugs,
          label: 'slug เก่า — สำหรับ redirect (Previous slugs)',
          widget: list,
          required: false,
          field: { name: slug, label: 'slug', widget: string },
        }

  - name: articles_en
    label: 'บล็อก — อังกฤษ (Blog EN)'
    folder: src/content/articles/en
    create: true
    slug: '{{fields.slug}}'
    fields:
      - {
          name: translationKey,
          label: 'รหัสเชื่อมคำแปล — ใช้รหัสเดียวกันทุกภาษา (Translation key)',
          widget: string,
        }
      - { name: locale, label: 'ภาษา (Language)', widget: hidden, default: en }
      - { name: title, label: 'หัวข้อ (Title)', widget: string }
      - { name: description, label: 'คำโปรยสั้น สำหรับ Google (Meta description)', widget: text }
      - { name: slug, label: 'ลิงก์ URL (Slug)', widget: string }
      - {
          name: author,
          label: 'ผู้เขียน (Author)',
          widget: select,
          options:
            [
              { label: 'Apple Vegan Cafe — องค์กร (Organization)', value: editorial },
              { label: 'ครอบครัวร้าน — ใช้หลังอนุมัติเท่านั้น (Family)', value: family },
            ],
          default: editorial,
        }
      - {
          name: publishedAt,
          label: 'วันที่เผยแพร่ (Published)',
          widget: datetime,
          format: 'YYYY-MM-DD',
        }
      - { name: draft, label: 'ฉบับร่าง (Draft)', widget: boolean, default: true }
      - { name: body, label: 'เนื้อหา (Text)', widget: markdown }

  - name: articles_th
    label: 'บล็อก — ไทย (Blog TH)'
    folder: src/content/articles/th
    create: true
    slug: '{{fields.slug}}'
    fields:
      - {
          name: translationKey,
          label: 'รหัสเชื่อมคำแปล — ใช้รหัสเดียวกันทุกภาษา (Translation key)',
          widget: string,
        }
      - { name: locale, label: 'ภาษา (Language)', widget: hidden, default: th }
      - { name: title, label: 'หัวข้อ (Title)', widget: string }
      - { name: description, label: 'คำโปรยสั้น สำหรับ Google (Meta description)', widget: text }
      - { name: slug, label: 'ลิงก์ URL (Slug)', widget: string }
      - {
          name: author,
          label: 'ผู้เขียน (Author)',
          widget: select,
          options:
            [
              { label: 'Apple Vegan Cafe — องค์กร (Organization)', value: editorial },
              { label: 'ครอบครัวร้าน — ใช้หลังอนุมัติเท่านั้น (Family)', value: family },
            ],
          default: editorial,
        }
      - {
          name: publishedAt,
          label: 'วันที่เผยแพร่ (Published)',
          widget: datetime,
          format: 'YYYY-MM-DD',
        }
      - { name: draft, label: 'ฉบับร่าง (Draft)', widget: boolean, default: true }
      - { name: body, label: 'เนื้อหา (Text)', widget: markdown }

  - name: articles_ru
    label: 'บล็อก — รัสเซีย (Blog RU)'
    folder: src/content/articles/ru
    create: true
    slug: '{{fields.slug}}'
    fields:
      - {
          name: translationKey,
          label: 'รหัสเชื่อมคำแปล — ใช้รหัสเดียวกันทุกภาษา (Translation key)',
          widget: string,
        }
      - { name: locale, label: 'ภาษา (Language)', widget: hidden, default: ru }
      - { name: title, label: 'หัวข้อ (Title)', widget: string }
      - { name: description, label: 'คำโปรยสั้น สำหรับ Google (Meta description)', widget: text }
      - { name: slug, label: 'ลิงก์ URL (Slug)', widget: string }
      - {
          name: author,
          label: 'ผู้เขียน (Author)',
          widget: select,
          options:
            [
              { label: 'Apple Vegan Cafe — องค์กร (Organization)', value: editorial },
              { label: 'ครอบครัวร้าน — ใช้หลังอนุมัติเท่านั้น (Family)', value: family },
            ],
          default: editorial,
        }
      - {
          name: publishedAt,
          label: 'วันที่เผยแพร่ (Published)',
          widget: datetime,
          format: 'YYYY-MM-DD',
        }
      - { name: draft, label: 'ฉบับร่าง (Draft)', widget: boolean, default: true }
      - { name: body, label: 'เนื้อหา (Text)', widget: markdown }

  - name: pages
    label: 'หน้าเว็บถาวร (Static pages)'
    folder: src/content/pages
    create: false
    fields:
      - { name: translationKey, label: 'รหัสเชื่อมคำแปล (Translation key)', widget: string }
      - name: locale
        label: 'ภาษา (Language)'
        widget: select
        options:
          - { label: 'อังกฤษ (EN)', value: en }
          - { label: 'ไทย (TH)', value: th }
          - { label: 'รัสเซีย (RU)', value: ru }
      - { name: title, label: 'หัวข้อ (Title)', widget: string }
      - { name: description, label: 'คำโปรยสั้น สำหรับ Google (meta)', widget: text }
      - { name: body, label: 'เนื้อหา (Text)', widget: markdown }

  - name: site
    label: 'ตั้งค่าเว็บไซต์ (Site settings)'
    files:
      - name: settings
        label: 'ข้อมูลร้าน — ชื่อ เบอร์โทร ลิงก์ (Cafe info)'
        file: src/content/settings.json
        fields:
          - name: site
            label: 'ตั้งค่า (Settings)'
            widget: object
            fields:
              - { name: name, label: 'Official name', widget: string }
              - {
                  name: nameLocalized,
                  label: 'ชื่อที่แสดง (Displayed name)',
                  widget: object,
                  fields:
                    [
                      { name: en, label: 'อังกฤษ (English)', widget: string },
                      { name: th, label: ไทย, widget: string },
                      { name: ru, label: 'รัสเซีย (Русский)', widget: string },
                    ],
                }
              - {
                  name: tagline,
                  label: 'คำโปรยร้าน (Tagline)',
                  widget: object,
                  fields:
                    [
                      { name: en, label: 'อังกฤษ (English)', widget: string },
                      { name: th, label: ไทย, widget: string },
                      { name: ru, label: 'รัสเซีย (Русский)', widget: string },
                    ],
                }
              - { name: phone, label: 'โทรศัพท์ (Phone)', widget: string }
              - {
                  name: whatsappUrl,
                  label: 'ลิงก์ WhatsApp แบบเต็ม (Full WhatsApp URL)',
                  widget: string,
                  required: false,
                }
              - {
                  name: lineUrl,
                  label: 'ลิงก์ LINE แบบเต็ม (Full LINE URL)',
                  widget: string,
                  required: false,
                }
              - {
                  name: primaryContact,
                  label: 'ช่องทางติดต่อด่วนหลัก (Primary contact)',
                  widget: select,
                  options:
                    [
                      { label: 'โทรศัพท์ (Phone)', value: phone },
                      { label: LINE, value: line },
                      { label: WhatsApp, value: whatsapp },
                    ],
                  default: phone,
                }
              - {
                  name: responseHours,
                  label: 'เวลาที่ทีมตอบข้อความ (Response hours)',
                  widget: object,
                  required: false,
                  fields:
                    [
                      { name: en, label: 'อังกฤษ (English)', widget: string },
                      { name: th, label: ไทย, widget: string },
                      { name: ru, label: 'รัสเซีย (Русский)', widget: string },
                    ],
                }
              - { name: email, label: 'อีเมล (Email)', widget: string, required: false }
              - {
                  name: social,
                  label: 'ลิงก์โซเชียล (Social links)',
                  widget: list,
                  required: false,
                  fields:
                    [
                      { name: platform, label: 'แพลตฟอร์ม (Platform)', widget: string },
                      { name: url, label: 'ลิงก์ (URL)', widget: string },
                    ],
                }
              - {
                  name: orderingLinks,
                  label: 'ลิงก์เดลิเวอรีที่ยืนยันแล้ว (Confirmed delivery links)',
                  widget: list,
                  required: false,
                  summary: '{{fields.provider}}',
                  fields:
                    [
                      {
                        name: provider,
                        label: 'ผู้ให้บริการ (Provider)',
                        widget: select,
                        options: [GrabFood, 'LINE MAN'],
                      },
                      {
                        name: url,
                        label: 'ลิงก์ share/สั่งอาหารทางการ (Official order URL)',
                        widget: string,
                      },
                    ],
                }
              - {
                  name: reviewLinks,
                  label: 'ลิงก์รีวิว (Review links)',
                  widget: object,
                  fields:
                    [
                      {
                        name: googleProfile,
                        label: 'โปรไฟล์ธุรกิจบน Google (Google Business Profile)',
                        widget: string,
                        required: false,
                      },
                      {
                        name: googleReview,
                        label: 'ลิงก์เขียนรีวิว Google โดยตรง (Direct review link)',
                        widget: string,
                        required: false,
                      },
                      { name: happycow, label: HappyCow, widget: string, required: false },
                      { name: tripadvisor, label: TripAdvisor, widget: string, required: false },
                    ],
                }
      - name: location
        label: 'ที่อยู่และเวลาเปิด-ปิด (Address & opening hours)'
        file: src/content/locations.json
        fields:
          - name: pattaya
            label: 'พัทยา (Pattaya)'
            widget: object
            fields:
              - {
                  name: address,
                  label: 'ที่อยู่ (Address)',
                  widget: object,
                  fields:
                    [
                      { name: en, label: 'อังกฤษ (English)', widget: string },
                      { name: th, label: ไทย, widget: string },
                      { name: ru, label: 'รัสเซีย (Русский)', widget: string },
                    ],
                }
              - {
                  name: geo,
                  label: 'พิกัดจากหมุด Google Maps ที่ตรวจแล้ว (Verified coordinates)',
                  widget: object,
                  required: false,
                  fields:
                    [
                      { name: lat, label: 'ละติจูด (Latitude)', widget: number, value_type: float },
                      {
                        name: lng,
                        label: 'ลองจิจูด (Longitude)',
                        widget: number,
                        value_type: float,
                      },
                    ],
                }
              - {
                  name: mapsUrl,
