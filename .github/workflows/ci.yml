# CI gate: lint → typecheck → unit tests → content validation → build →
# link check → e2e smoke → Lighthouse budget.
# Renovate automerge is allowed ONLY when this workflow is green.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable pnpm via corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Validate content
        run: pnpm validate:content

      - name: Build
        env:
          PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
        run: pnpm build

      - name: Verify private data stays outside the public build
        run: pnpm privacy:check -- --dist

      # canonical/hreflang tags point at the production origin; before the domain
      # is live those would fail DNS — internal <a> links are relative and checked.
      # Instagram intermittently returns 429 to GitHub Actions link crawlers.
      # TODO after launch: keep only stable external URLs in the crawler.
      - name: Audit internal links and anchors
        run: pnpm audit:links

      - name: Check links
        run: pnpm exec linkinator ./dist --recurse --silent --skip "^(https://apple-vegan-cafe.com|https://www.instagram.com/apple\\.vegan\\.restaurant/)"

      - name: Install Playwright browser
        # GitHub's Ubuntu image already includes the browser runtime libraries.
        # Avoid `--with-deps` here: that starts apt against an external mirror,
        # which can hang for hours even though the application checks are green.
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Lighthouse budget
        run: pnpm exec lhci autorun

      - name: Upload verified production artifact
        id: production-artifact
        uses: actions/upload-artifact@v7
        with:
          name: production-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          # Preserve the audited public .well-known/security.txt in the tested tree.
          include-hidden-files: true
          retention-days: 1

      - name: Record production artifact digest
        run: echo "Production artifact SHA-256 — \`${{ steps.production-artifact.outputs.artifact-digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy verified main
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verified-deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
